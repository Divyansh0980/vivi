<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Baby ❤️</title>
    <!-- Google Fonts for a beautiful handwritten script -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* Glowing background blobs */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,10,84,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        /* Message Card */
        .card {
            position: relative;
            z-index: 3;
            text-align: center;
            pointer-events: none; /* Let clicks pass through to the canvas */
            animation: fadeIn 3s ease-out forwards;
            opacity: 0;
        }
        .main-text {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #ffb6c1;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.6), 0 0 20px rgba(255, 182, 193, 0.4);
            margin-bottom: 10px;
            letter-spacing: 1px;
            animation: pulse 2.5s infinite ease-in-out;
        }
        .sub-text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 10px rgba(255, 182, 193, 0.6); }
            50% { transform: scale(1.05); text-shadow: 0 0 25px rgba(255, 182, 193, 0.9); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <canvas id="heartCanvas"></canvas>
    
    <div class="card">
        <h1 class="main-text">I love you my baby</h1>
        <p class="sub-text">Forever & Always</p>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Parametric Heart Formula values
        const scale = Math.min(width, height) * 0.018; 
        const heartPoints = [];
        for (let angle = 0; angle < Math.PI * 2; angle += 0.05) {
            // Heart shape equations
            const x = 16 * Math.pow(Math.sin(angle), 3);
            const y = -(13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle));
            heartPoints.push({ x: x * scale, y: y * scale });
        }

        // Particle System
        class Particle {
            constructor(x, y, dx, dy, color, size, life) {
                this.x = x;
                this.y = y;
                this.dx = dx;
                this.dy = dy;
                this.color = color;
                this.size = size;
                this.life = life;
                this.maxLife = life;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset shadow
            }

            update() {
                this.x += this.dx;
                this.y += this.dy;
                this.size *= 0.96;
                this.life--;
            }
        }

        const particles = [];
        const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#ffb6c1'];

        // Spawns particles along the heart boundary
        let pointIndex = 0;
        function spawnHeartParticles() {
            // Get current coordinate on the heart
            const pt = heartPoints[pointIndex];
            const centerX = width / 2;
            const centerY = height / 2 - (scale * 2); // Shift heart up slightly
            
            // Add particles from this point
            const px = centerX + pt.x;
            const py = centerY + pt.y;
            
            for(let k = 0; k < 2; k++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 1.5;
                const dx = Math.sin(angle) * speed;
                const dy = Math.cos(angle) * speed;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(px, py, dx, dy, color, Math.random() * 4 + 2, Math.random() * 50 + 30));
            }
            
            pointIndex = (pointIndex + 1) % heartPoints.length;
        }

        // Click interaction: spawns hearts/particles on click
        window.addEventListener('click', (e) => {
            const num = 15;
            for(let i=0; i<num; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                const dx = Math.sin(angle) * speed;
                const dy = Math.cos(angle) * speed;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(e.clientX, e.clientY, dx, dy, color, Math.random() * 5 + 3, Math.random() * 60 + 40));
            }
        });

        // Animation Loop
        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 10, 0.15)'; // Trail effect
            ctx.fillRect(0, 0, width, height);

            spawnHeartParticles();
            spawnHeartParticles(); // Spawn 2 per frame for high density

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0 || particles[i].size <= 0.1) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
